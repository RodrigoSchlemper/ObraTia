<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Novo Custo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    h2 {
      text-align: center;
      padding: 20px 0 10px;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
    }

    form {
      background-color: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      margin-top: 15px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input[type="file"] {
      margin-top: 10px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .checkbox-group input {
      margin-right: 8px;
    }

    button {
      display: block;
      width: 100%;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .voltar {
      text-align: center;
      margin-top: 15px;
    }

    .voltar a {
      color: #007bff;
      text-decoration: none;
      font-size: 15px;
    }

    .voltar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Cadastrar Novo Custo</h2>
  <div class="container">
    <form action="/editar" method="POST" enctype="multipart/form-data">
      <label>Tipo:</label>
      <select name="tipo">
        <option value="Material">Material</option>
        <option value="Mão de obra">Mão de obra</option>
        <option value="Construtora">Construtora</option>
      </select>

      <label>Descrição:</label>
      <input type="text" name="descricao">

      <label>Valor:</label>
      <input type="number" name="valor" step="0.01">

      <label>Data da Compra:</label>
      <input type="date" name="data_compra">

      <label>Observação:</label>
      <textarea name="observacao" rows="2"></textarea>

      <label>Anexo:</label>
      <input type="file" name="anexo">

      <div class="checkbox-group">
        <input type="checkbox" name="remover_anexo" value="1">
        <label for="remover_anexo">Remover anexo existente</label>
      </div>

      <button type="submit">Salvar</button>
    </form>

    <div class="voltar">
      <a href="/listar">&larr; Voltar para listagem</a>
    </div>
  </div>
</body>
</html>
